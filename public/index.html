<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shikimori Finder Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>✨ Shikimori Finder Hub</h1>
  
  <div class="search-box">
    <input type="text" id="searchInput" value="The World's Finest Assassin" placeholder="Введите название аниме...">
    <button id="searchBtn" onclick="searchAnime()">Найти</button>
  </div>

  <div id="error" class="error hidden"></div>
  <div id="searchLoader" class="hidden" style="text-align: center; padding: 20px;"><span class="loader"></span> Поиск аниме...</div>
  
  <div id="animeResults" class="anime-list"></div>

  <div id="characterSection" class="characters-section hidden">
    <h2 id="selectedTitle" style="margin-top:0; font-size:18px;"></h2>
    
    <div class="controls-bar">
      <button id="loadCharsBtn" onclick="loadCharacters()">Загрузить персонажей</button>
      <button id="exportBtn" onclick="exportJSON()" disabled>Экспорт в JSON</button>
      <span id="charCounter" class="badge">0 персонажей</span>
      <input type="text" id="charFilter" placeholder="Фильтр по имени..." oninput="renderCharacters()">
      <select id="roleFilter" onchange="renderCharacters()">
        <option value="all">Все роли</option>
        <option value="Main">Главные (Main)</option>
        <option value="Supporting">Второстепенные (Supporting)</option>
      </select>
    </div>

    <div id="charLoader" class="hidden" style="margin: 10px 0;"><span class="loader"></span> Загрузка персонажей...</div>
    <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
    <div id="progressText" style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;"></div>
    
    <div id="charactersGrid" class="characters-grid"></div>
  </div>
</div>

<!-- Модальное окно с деталями персонажа, описанием и пролистываемыми референсами -->
<div id="charModal" class="modal-overlay hidden" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-header">
      <img id="modalImg" class="modal-poster" src="" alt="">
      <div class="modal-title-area">
        <h2 id="modalName">Имя персонажа</h2>
        <p id="modalRole" style="color: #f43f5e; font-weight:600;"></p>
        <a id="modalLink" href="" target="_blank" style="font-size: 12px; color: #818cf8; text-decoration: none;">Открыть на Shikimori ↗</a>
      </div>
    </div>
    
    <div class="modal-description" id="modalDesc">Загрузка описания...</div>
    
    <div class="references-section">
      <h3>Референсы и арты</h3>
      <div class="references-container">
        <button class="slider-btn" onclick="scrollSlider(-1)">‹</button>
        <div id="modalRefs" class="refs-slider">
          <span style="font-size: 12px; color: var(--text-muted);">Загрузка референсов...</span>
        </div>
        <button class="slider-btn" onclick="scrollSlider(1)">›</button>
      </div>
    </div>
  </div>
</div>

<script>
const SHIKI_API = "/api/shiki/graphql";
const MISSING_IMG = "https://shikimori.io/assets/globals/missing_original.jpg";

let currentAnime = null;
const charactersCache = {};
let allCharacters = [];

function getValidImageUrl(url) {
  if (!url || url.includes('missing')) return MISSING_IMG;
  return url;
}

async function fetchGraphQL(query, variables = {}) {
  const resp = await fetch(SHIKI_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, variables })
  });

  const text = await resp.text();
  let result;
  try {
    result = JSON.parse(text);
  } catch (e) {
    throw new Error(`Сервер вернул не JSON: ${text.substring(0, 100)}`);
  }

  if (result.errors) throw new Error(result.errors[0].message);
  return result.data;
}

async function searchAnime() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const btn = document.getElementById('searchBtn');
  const err = document.getElementById('error');
  const loader = document.getElementById('searchLoader');
  const res = document.getElementById('animeResults');

  btn.disabled = true; btn.textContent = 'Поиск...';
  loader.classList.remove('hidden');
  err.classList.add('hidden'); res.innerHTML = '';
  document.getElementById('characterSection').classList.add('hidden');

  const query = `
    query($search: String) {
      animes(search: $search, limit: 12) {
        id
        name
        russian
        kind
        status
        airedOn { year }
        poster { originalUrl }
      }
    }
  `;

  try {
    const data = await fetchGraphQL(query, { search: q });
    const animes = data.animes || [];
    if (!animes.length) { res.innerHTML = '<p style="color:var(--text-muted)">Ничего не найдено.</p>'; return; }

    animes.forEach(anime => {
      const card = document.createElement('div');
      card.className = 'anime-card';
      if (currentAnime && currentAnime.id === anime.id) {
        card.classList.add('selected');
      }
      card.onclick = () => selectAnime(anime, card);
      
      const imgSrc = getValidImageUrl(anime.poster?.originalUrl);

      card.innerHTML = `
        <div class="img-container">
          <img src="${imgSrc}" alt="" loading="lazy">
        </div>
        <div class="anime-card-content">
          <h3>${anime.russian || anime.name}</h3>
          <p>${anime.name}</p>
          <div><span class="badge">${anime.kind ? anime.kind.toUpperCase() : 'TV'}</span> • ${anime.airedOn?.year || '—'}</div>
        </div>`;
      res.appendChild(card);
    });
  } catch(e) {
    err.textContent = 'Ошибка поиска: ' + e.message;
    err.classList.remove('hidden');
  } finally { 
    btn.disabled = false; btn.textContent = 'Найти'; 
    loader.classList.add('hidden');
  }
}

function selectAnime(anime, card) {
  currentAnime = anime;
  document.querySelectorAll('.anime-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  
  document.getElementById('characterSection').classList.remove('hidden');
  document.getElementById('selectedTitle').textContent = `✨ ${anime.russian || anime.name} (ID: ${anime.id})`;
  
  document.getElementById('charFilter').value = '';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressText').textContent = '';

  if (charactersCache[anime.id]) {
    allCharacters = charactersCache[anime.id];
    document.getElementById('charCounter').textContent = allCharacters.length + ' персонажей';
    document.getElementById('exportBtn').disabled = false;
    document.getElementById('loadCharsBtn').textContent = 'Обновить персонажей';
    renderCharacters();
  } else {
    allCharacters = [];
    document.getElementById('charactersGrid').innerHTML = '';
    document.getElementById('charCounter').textContent = '0 персонажей';
    document.getElementById('exportBtn').disabled = true;
    document.getElementById('loadCharsBtn').textContent = 'Загрузить персонажей';
  }
}

async function loadCharacters() {
  if (!currentAnime) return;
  
  const btn = document.getElementById('loadCharsBtn');
  const loader = document.getElementById('charLoader');
  const grid = document.getElementById('charactersGrid');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  
  btn.disabled = true; loader.classList.remove('hidden'); grid.innerHTML = '';
  progressBar.style.width = '30%'; progressText.textContent = 'Запрос к серверу Shikimori...';

  const query = `
    query($id: String!) {
      animes(ids: $id) {
        characterRoles {
          rolesEn
          rolesRu
          character {
            id
            name
            russian
            url
            poster { originalUrl }
          }
        }
      }
    }
  `;

  try {
    const data = await fetchGraphQL(query, { id: String(currentAnime.id) });
    progressBar.style.width = '70%';
    progressText.textContent = 'Обработка данных...';
    
    const roles = data.animes[0]?.characterRoles || [];

    const map = new Map();
    for (const item of roles) {
      const ch = item.character;
      if (!ch || !ch.id) continue;
      
      const roleName = item.rolesEn ? item.rolesEn[0] : (item.rolesRu ? item.rolesRu[0] : 'Main');

      if (!map.has(ch.id)) {
        map.set(ch.id, {
          id: ch.id,
          name: ch.name,
          russian: ch.russian,
          image: getValidImageUrl(ch.poster?.originalUrl),
          url: ch.url,
          role: roleName
        });
      }
    }

    allCharacters = Array.from(map.values());
    charactersCache[currentAnime.id] = allCharacters;

    document.getElementById('charCounter').textContent = allCharacters.length + ' персонажей';
    document.getElementById('exportBtn').disabled = allCharacters.length === 0;
    
    renderCharacters();
    progressBar.style.width = '100%';
    progressText.textContent = `Готово! Загружено персонажей: ${allCharacters.length}`;
  } catch(e) {
    grid.innerHTML = `<p class="error">Ошибка загрузки: ${e.message}</p>`;
    progressText.textContent = 'Ошибка';
  } finally { 
    btn.disabled = false; loader.classList.add('hidden'); 
  }
}

function renderCharacters() {
  const grid = document.getElementById('charactersGrid');
  const q = (document.getElementById('charFilter').value || '').toLowerCase();
  const role = document.getElementById('roleFilter').value;
  
  const list = allCharacters.filter(c => {
    const nameMatch = (c.russian||'').toLowerCase().includes(q) || (c.name||'').toLowerCase().includes(q);
    const roleMatch = role === 'all' || (c.role && c.role.toLowerCase() === role.toLowerCase());
    return nameMatch && roleMatch;
  });

  grid.innerHTML = '';
  if (!list.length) { 
    grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">Персонажи не найдены по фильтру.</p>'; 
    return; 
  }
  
  list.slice(0, 200).forEach(c => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.onclick = () => openCharacterDetails(c);
    
    card.innerHTML = `
      <div class="img-container" style="height: 190px;">
        <img src="${c.image}" alt="" loading="lazy">
      </div>
      <div class="char-info">
        <div class="char-name">${c.russian || c.name || 'Не указано'}</div>
        <div class="char-role">${c.role || 'Не указано'}</div>
        <span class="details-hint">Подробнее ↗</span>
      </div>`;
    grid.appendChild(card);
  });
  
  if (list.length > 200) {
    const more = document.exports = document.createElement('p');
    more.style.gridColumn = '1/-1';
    more.style.color = 'var(--text-muted)';
    more.style.textAlign = 'center';
    more.textContent = `Показаны первые 200 из ${list.length}`;
    grid.appendChild(more);
  }
}

// Загрузка деталей персонажа вместе с галереей (картинками-референсами) через GraphQL
async function openCharacterDetails(char) {
  const modal = document.getElementById('charModal');
  const modalImg = document.getElementById('modalImg');
  const modalName = document.getElementById('modalName');
  const modalRole = document.getElementById('modalRole');
  const modalLink = document.getElementById('modalLink');
  const modalDesc = document.getElementById('modalDesc');
  const modalRefs = document.getElementById('modalRefs');

  modalImg.src = char.image;
  modalName.textContent = char.russian || char.name;
  modalRole.textContent = `Роль: ${char.role}`;
  modalLink.href = char.url ? `https://shikimori.io${char.url}` : '#';
  modalDesc.textContent = 'Загрузка описания...';
  modalRefs.innerHTML = '<span style="font-size: 12px; color: var(--text-muted);">Загрузка артов...</span>';
  
  modal.classList.remove('hidden');

  // Запрашиваем описание, постер и галерею картинок (если доступна)
  const query = `
    query($id: String!) {
      characters(ids: $id) {
        description
        russian
        name
        poster { originalUrl }
        otherImages { originalUrl }
      }
    }
  `;

  try {
    const data = await fetchGraphQL(query, { id: String(char.id) });
    const details = data.characters && data.characters[0];

    if (details) {
      let desc = details.description || 'Описание отсутствует.';
      
      // Автоматическая замена тегов [character=ID] на кликабельные имена
      desc = desc.replace(/\[character=(\d+)\](.*?)\[\/character\]/g, (match, id, name) => {
        return `<a href="https://shikimori.io/characters/${id}" target="_blank" style="color: #818cf8; text-decoration: underline;">${name}</a>`;
      });
      desc = desc.replace(/\[spoiler\]([\s\S]*?)\[\/spoiler\]/g, '<span style="background: #334155; padding: 2px 6px; border-radius: 4px;">$1</span>');

      modalDesc.innerHTML = desc.replace(/\n/g, '<br>');
      
      // Заполняем карусель референсов
      modalRefs.innerHTML = '';
      
      let allImages = [];
      if (details.poster?.originalUrl) allImages.push(details.poster.originalUrl);
      if (details.otherImages && Array.isArray(details.otherImages)) {
        details.otherImages.forEach(img => {
          if (img.originalUrl) allImages.push(img.originalUrl);
        });
      }

      if (allImages.length > 0) {
        allImages.forEach(imgUrl => {
          const validUrl = getValidImageUrl(imgUrl);
          const slide = document.createElement('div');
          slide.className = 'ref-slide-item';
          slide.innerHTML = `<img src="${validUrl}" alt="art" loading="lazy" onclick="window.open('${validUrl}', '_blank')">`;
          modalRefs.appendChild(slide);
        });
      } else {
        modalRefs.innerHTML = '<span style="font-size: 12px; color: var(--text-muted);">Дополнительные референсы отсутствуют.</span>';
      }

    } else {
      modalDesc.textContent = 'Не удалось загрузить подробную информацию.';
      modalRefs.innerHTML = '<span style="font-size: 12px; color: var(--text-muted);">Нет данных</span>';
    }
  } catch(e) {
    modalDesc.textContent = 'Ошибка загрузки: ' + e.message;
    modalRefs.innerHTML = '<span style="font-size: 12px; color: var(--text-muted);">Ошибка</span>';
  }
}

// Функция пролистывания слайдера референсов вправо/влево при нажатии на стрелочки
function scrollSlider(direction) {
  const slider = document.getElementById('modalRefs');
  slider.scrollBy({ left: direction * 150, behavior: 'smooth' });
}

function closeModal(e) {
  if (!e || e.target.id === 'charModal' || e.target.classList.contains('modal-close')) {
    document.getElementById('charModal').classList.add('hidden');
  }
}

function exportJSON() {
  if (!currentAnime || !allCharacters.length) return;
  const data = { anime: { id: currentAnime.id, title: currentAnime.russian||currentAnime.name }, characters: allCharacters };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `shikimori_${currentAnime.id}.json`;
  a.click();
}
</script>
</body>
</html>
