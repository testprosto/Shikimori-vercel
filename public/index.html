<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shikimori Finder Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>✨ Shikimori Finder Hub</h1>

  <div class="search-box" role="search" aria-label="Поиск аниме">
    <label for="searchInput" class="sr-only">Название аниме</label>
    <input
      type="text"
      id="searchInput"
      value="The World's Finest Assassin"
      placeholder="Введите название аниме..."
      autocomplete="off"
      aria-label="Название аниме">
    <button id="searchBtn" type="button" onclick="searchAnime()" aria-label="Найти аниме">Найти</button>
  </div>

  <div id="error" class="error hidden" role="alert" aria-live="assertive"></div>
  <div id="searchLoader" class="hidden" role="status" aria-live="polite"
       style="text-align: center; padding: 20px;">
    <span class="loader" aria-hidden="true"></span> Поиск аниме...
  </div>

  <div id="animeResults" class="anime-list" aria-live="polite" aria-busy="false"></div>
</div>

<!-- Модальное окно для управления аниме -->
<div
  id="animeModal"
  class="modal-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="animeModalTitle"
  aria-hidden="true"
  onclick="closeAnimeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()" aria-busy="false">
    <button class="modal-close" type="button" onclick="closeAnimeModal()" aria-label="Закрыть окно аниме">×</button>
    <div class="modal-header">
      <img id="animeModalImg" class="modal-poster" src="" alt="Постер аниме">
      <div class="modal-title-area">
        <h2 id="animeModalTitle">Название аниме</h2>
        <p id="animeModalMeta" style="color: var(--text-muted); font-size:12px;"></p>
      </div>
    </div>

    <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
      <div class="controls-bar" style="margin: 0 0 15px 0;">
        <button id="loadCharsBtn" type="button" onclick="loadCharacters()">Загрузить персонажей</button>
        <button id="exportBtn" type="button" onclick="exportJSON()" disabled aria-disabled="true">Экспорт в JSON</button>
        <span id="charCounter" class="badge" role="status" aria-live="polite">0 персонажей</span>
      </div>

      <div role="group" aria-label="Фильтры персонажей"
           style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
        <label for="charFilter" class="sr-only">Фильтр по имени персонажа</label>
        <input
          type="text"
          id="charFilter"
          placeholder="Фильтр по имени..."
          autocomplete="off"
          style="flex:1; min-width: 150px;"
          oninput="renderCharacters()"
          aria-label="Фильтр по имени персонажа">
        <label for="roleFilter" class="sr-only">Фильтр по роли</label>
        <select id="roleFilter" onchange="renderCharacters()" style="width: auto;" aria-label="Фильтр по роли">
          <option value="all">Все роли</option>
          <option value="Main">Главные (Main)</option>
          <option value="Supporting">Второстепенные (Supporting)</option>
        </select>
      </div>

      <div id="charLoader" class="hidden" role="status" aria-live="polite" style="margin: 10px 0;">
        <span class="loader" aria-hidden="true"></span> Загрузка персонажей...
      </div>
      <div class="progress-container"
           role="progressbar"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="0"
           aria-label="Прогресс загрузки персонажей">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="progressText" role="status" aria-live="polite"
           style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;"></div>

      <div id="charactersGrid" class="characters-grid" aria-busy="false"></div>
    </div>
  </div>
</div>

<!-- Модальное окно с деталями персонажа и лентой референсов -->
<div
  id="charModal"
  class="modal-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modalName"
  aria-hidden="true"
  onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()" aria-busy="false">
    <button class="modal-close" type="button" onclick="closeModal()" aria-label="Закрыть окно персонажа">×</button>
    <div class="modal-header">
      <img id="modalImg" class="modal-poster" src="" alt="Портрет персонажа">
      <div class="modal-title-area">
        <h2 id="modalName">Имя персонажа</h2>
        <p id="modalRole" style="color: #fb7185; font-weight:600;"></p>
        <a id="modalLink" href="#" target="_blank" rel="noopener noreferrer"
           style="font-size: 12px; color: #a5b4fc; text-decoration: none;">
          Открыть на Shikimori ↗
        </a>
      </div>
    </div>

    <div class="modal-description" id="modalDesc">Загрузка описания...</div>

    <div class="references-section">
      <h3>Референсы и арты (прокрутите вправо ➔)</h3>
      <div id="modalRefs" class="refs-scroll-container"
           role="list"
           aria-label="Галерея референсов персонажа">
        <span style="font-size: 12px; color: var(--text-muted);">Загрузка референсов...</span>
      </div>
    </div>
  </div>
</div>

<script>
const SHIKI_API = "/api/shiki/graphql";
const MISSING_IMG = "missing.jpg";

let currentAnime = null;
const charactersCache = new Map();
const CACHE_LIMIT = 50;
let allCharacters = [];

let detailsSeq = 0;
let searchController = null;

/* ---------- Фокус-менеджмент ---------- */

// FIX: запоминаем, откуда открыли модалку, чтобы вернуть фокус после закрытия.
const lastFocus = { anime: null, char: null };

function focusFirstIn(modalEl) {
  const closeBtn = modalEl.querySelector('.modal-close');
  if (closeBtn) closeBtn.focus();
}

/* ---------- Утилиты ---------- */

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function getValidImageUrl(url) {
  if (!url || url.includes('missing')) return MISSING_IMG;
  return url;
}

function attachImgFallback(imgEl) {
  imgEl.addEventListener('error', function handler() {
    imgEl.removeEventListener('error', handler);
    imgEl.src = MISSING_IMG;
  });
}

/* ---------- Управление модалками (a11y) ---------- */

function openModal(id, fromElement) {
  const modal = document.getElementById(id);
  const key = id === 'animeModal' ? 'anime' : 'char';
  lastFocus[key] = fromElement || document.activeElement;
  modal.classList.remove('hidden');
  modal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  // Ждём кадр, чтобы анимация/фокус сработали после появления в DOM.
  requestAnimationFrame(() => focusFirstIn(modal));
}

function closeModalById(id) {
  const modal = document.getElementById(id);
  if (modal.classList.contains('hidden')) return;
  const key = id === 'animeModal' ? 'anime' : 'char';
  modal.classList.add('hidden');
  modal.setAttribute('aria-hidden', 'true');
  // Возвращаем фокус туда, откуда пришли.
  if (lastFocus[key] && document.contains(lastFocus[key])) {
    lastFocus[key].focus();
  }
  lastFocus[key] = null;
  // Если открыта ещё одна модалка — оставляем блокировку скролла.
  const anyOpen = !document.getElementById('animeModal').classList.contains('hidden')
               || !document.getElementById('charModal').classList.contains('hidden');
  if (!anyOpen) document.body.style.overflow = '';
}

/* FIX: Escape закрывает верхнюю открытую модалку. */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!document.getElementById('charModal').classList.contains('hidden')) {
    closeModalById('charModal');
  } else if (!document.getElementById('animeModal').classList.contains('hidden')) {
    closeModalById('animeModal');
  }
});

/* ---------- GraphQL ---------- */

async function fetchGraphQL(query, variables = {}, signal = undefined) {
  const resp = await fetch(SHIKI_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, variables }),
    signal
  });

  const text = await resp.text();
  let result;
  try {
    result = JSON.parse(text);
  } catch (e) {
    throw new Error(`Сервер вернул не JSON: ${text.substring(0, 100)}`);
  }

  if (result.errors) throw new Error(result.errors[0].message);
  return result.data;
}

/* ---------- Поиск аниме ---------- */

async function searchAnime() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;

  if (searchController) searchController.abort();
  searchController = new AbortController();
  const signal = searchController.signal;

  const btn = document.getElementById('searchBtn');
  const err = document.getElementById('error');
  const loader = document.getElementById('searchLoader');
  const res = document.getElementById('animeResults');

  btn.disabled = true; btn.textContent = 'Поиск...';
  loader.classList.remove('hidden');
  err.classList.add('hidden'); res.innerHTML = '';
  res.setAttribute('aria-busy', 'true');

  const query = `
    query($search: String) {
      animes(search: $search, limit: 12) {
        id
        name
        russian
        kind
        status
        airedOn { year }
        poster { originalUrl }
      }
    }
  `;

  try {
    const data = await fetchGraphQL(query, { search: q }, signal);
    const animes = data.animes || [];
    if (!animes.length) {
      res.innerHTML = '<p style="color:var(--text-muted)">Ничего не найдено.</p>';
      return;
    }

    animes.forEach(anime => {
      // FIX: role="button" + tabindex + keydown — карточка работает с клавиатуры.
      const card = document.createElement('div');
      card.className = 'anime-card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      const title = anime.russian || anime.name;
      card.setAttribute('aria-label', `Аниме: ${title}. Открыть подробнее`);
      if (currentAnime && currentAnime.id === anime.id) {
        card.classList.add('selected');
      }
      card.onclick = (e) => openAnimeModal(anime, e);
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openAnimeModal(anime, e);
        }
      });

      const imgSrc = getValidImageUrl(anime.poster?.originalUrl);
      const kindUpper = anime.kind ? anime.kind.toUpperCase() : 'TV';
      const year = anime.airedOn?.year || '—';

      card.innerHTML = `
        <div class="img-container">
          <img src="${escapeHtml(imgSrc)}" alt="" loading="lazy">
        </div>
        <div class="anime-card-content">
          <h3>${escapeHtml(title)}</h3>
          <p>${escapeHtml(anime.name)}</p>
          <div><span class="badge">${escapeHtml(kindUpper)}</span> • ${escapeHtml(year)}</div>
        </div>`;

      attachImgFallback(card.querySelector('img'));
      res.appendChild(card);
    });
  } catch(e) {
    if (e.name === 'AbortError') return;
    err.textContent = 'Ошибка поиска: ' + e.message;
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Найти';
    loader.classList.add('hidden');
    res.setAttribute('aria-busy', 'false');
  }
}

/* ---------- Кеш ---------- */

function cacheSet(id, value) {
  if (charactersCache.size >= CACHE_LIMIT) {
    const oldestKey = charactersCache.keys().next().value;
    charactersCache.delete(oldestKey);
  }
  charactersCache.set(id, value);
}

function cacheGet(id) {
  if (!charactersCache.has(id)) return null;
  const value = charactersCache.get(id);
  charactersCache.delete(id);
  charactersCache.set(id, value);
  return value;
}

/* ---------- Модалка аниме ---------- */

function openAnimeModal(anime, event) {
  currentAnime = anime;
  document.querySelectorAll('.anime-card').forEach(c => c.classList.remove('selected'));
  const trigger = event && event.currentTarget ? event.currentTarget : document.activeElement;
  if (trigger && trigger.classList) trigger.classList.add('selected');

  const modalImg = document.getElementById('animeModalImg');
  modalImg.src = getValidImageUrl(anime.poster?.originalUrl);

  document.getElementById('animeModalTitle').textContent = anime.russian || anime.name;
  document.getElementById('animeModalMeta').textContent =
    `${anime.name} • ${anime.kind ? anime.kind.toUpperCase() : 'TV'} (${anime.airedOn?.year || '—'})`;

  document.getElementById('charFilter').value = '';
  const progressEl = document.querySelector('.progress-container');
  document.getElementById('progressBar').style.width = '0%';
  progressEl.setAttribute('aria-valuenow', '0');
  document.getElementById('progressText').textContent = '';

  const cached = cacheGet(anime.id);
  if (cached) {
    allCharacters = cached;
    document.getElementById('charCounter').textContent = allCharacters.length + ' персонажей';
    document.getElementById('exportBtn').disabled = false;
    document.getElementById('exportBtn').setAttribute('aria-disabled', 'false');
    document.getElementById('loadCharsBtn').textContent = 'Обновить персонажей';
    renderCharacters();
  } else {
    allCharacters = [];
    document.getElementById('charactersGrid').innerHTML = '';
    document.getElementById('charCounter').textContent = '0 персонажей';
    document.getElementById('exportBtn').disabled = true;
    document.getElementById('exportBtn').setAttribute('aria-disabled', 'true');
    document.getElementById('loadCharsBtn').textContent = 'Загрузить персонажей';
  }

  openModal('animeModal', trigger);
}

function closeAnimeModal(e) {
  if (!e || e.target.id === 'animeModal' || e.target.classList.contains('modal-close')) {
    closeModalById('animeModal');
  }
}

/* ---------- Загрузка персонажей ---------- */

async function loadCharacters() {
  if (!currentAnime) return;

  const btn = document.getElementById('loadCharsBtn');
  const loader = document.getElementById('charLoader');
  const grid = document.getElementById('charactersGrid');
  const progressBar = document.getElementById('progressBar');
  const progressEl = document.querySelector('.progress-container');
  const progressText = document.getElementById('progressText');
  const modalContent = document.querySelector('#animeModal .modal-content');

  btn.disabled = true; loader.classList.remove('hidden'); grid.innerHTML = '';
  grid.setAttribute('aria-busy', 'true');
  if (modalContent) modalContent.setAttribute('aria-busy', 'true');

  progressBar.style.width = '30%'; progressEl.setAttribute('aria-valuenow', '30');
  progressText.textContent = 'Запрос к серверу Shikimori...';

  const query = `
    query($id: String!) {
      animes(ids: $id) {
        characterRoles {
          rolesEn
          rolesRu
          character {
            id
            name
            russian
            url
            poster { originalUrl }
          }
        }
      }
    }
  `;

  try {
    const data = await fetchGraphQL(query, { id: String(currentAnime.id) });
    progressBar.style.width = '70%'; progressEl.setAttribute('aria-valuenow', '70');
    progressText.textContent = 'Обработка данных...';

    const roles = data.animes[0]?.characterRoles || [];

    const map = new Map();
    for (const item of roles) {
      const ch = item.character;
      if (!ch || !ch.id) continue;

      const roleName = item.rolesEn ? item.rolesEn[0] : (item.rolesRu ? item.rolesRu[0] : 'Main');

      if (!map.has(ch.id)) {
        map.set(ch.id, {
          id: ch.id,
          name: ch.name,
          russian: ch.russian,
          image: getValidImageUrl(ch.poster?.originalUrl),
          url: ch.url,
          role: roleName
        });
      }
    }

    allCharacters = Array.from(map.values());
    cacheSet(currentAnime.id, allCharacters);

    document.getElementById('charCounter').textContent = allCharacters.length + ' персонажей';
    const exportBtn = document.getElementById('exportBtn');
    exportBtn.disabled = allCharacters.length === 0;
    exportBtn.setAttribute('aria-disabled', String(allCharacters.length === 0));

    renderCharacters();
    progressBar.style.width = '100%'; progressEl.setAttribute('aria-valuenow', '100');
    progressText.textContent = `Готово! Загружено персонажей: ${allCharacters.length}`;
  } catch(e) {
    grid.innerHTML = `<p class="error" role="alert">Ошибка загрузки: ${escapeHtml(e.message)}</p>`;
    progressText.textContent = 'Ошибка';
  } finally {
    btn.disabled = false; loader.classList.add('hidden');
    grid.setAttribute('aria-busy', 'false');
    if (modalContent) modalContent.setAttribute('aria-busy', 'false');
  }
}

/* ---------- Рендер сетки персонажей ---------- */

function renderCharacters() {
  const grid = document.getElementById('charactersGrid');
  const q = (document.getElementById('charFilter').value || '').toLowerCase();
  const role = document.getElementById('roleFilter').value;

  const list = allCharacters.filter(c => {
    const nameMatch = (c.russian||'').toLowerCase().includes(q) || (c.name||'').toLowerCase().includes(q);
    const roleMatch = role === 'all' || (c.role && c.role.toLowerCase() === role.toLowerCase());
    return nameMatch && roleMatch;
  });

  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">Персонажи не найдены по фильтру.</p>';
    return;
  }

  list.slice(0, 200).forEach(c => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `Персонаж: ${c.russian || c.name || 'без имени'}. Подробнее`);
    card.onclick = () => openCharacterDetails(c, card);
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openCharacterDetails(c, card);
      }
    });

    card.innerHTML = `
      <div class="img-container" style="height: 170px;">
        <img src="${escapeHtml(c.image)}" alt="" loading="lazy">
      </div>
      <div class="char-info">
        <div class="char-name">${escapeHtml(c.russian || c.name || 'Не указано')}</div>
        <div class="char-role">${escapeHtml(c.role || 'Не указано')}</div>
        <span class="details-hint">Подробнее ↗</span>
      </div>`;
    attachImgFallback(card.querySelector('img'));
    grid.appendChild(card);
  });

  if (list.length > 200) {
    const more = document.createElement('p');
    more.style.gridColumn = '1/-1';
    more.style.color = 'var(--text-muted)';
    more.style.textAlign = 'center';
    more.textContent = `Показаны первые 200 из ${list.length}`;
    grid.appendChild(more);
  }
}

/* ---------- Детали персонажа ---------- */

async function openCharacterDetails(char, fromCard) {
  const mySeq = ++detailsSeq;

  const modalImg = document.getElementById('modalImg');
  const modalName = document.getElementById('modalName');
  const modalRole = document.getElementById('modalRole');
  const modalLink = document.getElementById('modalLink');
  const modalDesc = document.getElementById('modalDesc');
  const modalRefs = document.getElementById('modalRefs');
  const modalContent = document.querySelector('#charModal .modal-content');

  modalImg.src = char.image;
  modalImg.alt = `Портрет: ${char.russian || char.name || 'персонаж'}`;
  modalName.textContent = char.russian || char.name;
  modalRole.textContent = `Роль: ${char.role}`;

  const cleanUrl = char.url ? (char.url.startsWith('http') ? char.url : `https://shikimori.io${char.url}`) : '#';
  modalLink.href = cleanUrl;

  modalDesc.textContent = 'Загрузка описания...';
  modalRefs.innerHTML = '<span style="font-size: 12px; color: var(--text-muted);">Загрузка референсов...</span>';

  openModal('charModal', fromCard);
  if (modalContent) modalContent.setAttribute('aria-busy', 'true');

  const query = `
    query($id: String!) {
      characters(ids: $id) {
        description
        russian
        name
        poster { originalUrl }
      }
    }
  `;

  try {
    const data = await fetchGraphQL(query, { id: String(char.id) });

    if (mySeq !== detailsSeq) return;

    const details = data.characters && data.characters[0];

    if (details) {
      let desc = details.description || 'Описание отсутствует.';
      desc = escapeHtml(desc);

      desc = desc.replace(/\[character=(\d+)\](.*?)\[\/character\]/g, (match, id, name) => {
        return `<a href="https://shikimori.io/characters/${encodeURIComponent(id)}" target="_blank" rel="noopener noreferrer" style="color: #a5b4fc; text-decoration: underline;">${name}</a>`;
      });
      desc = desc.replace(/\[spoiler\]([\s\S]*?)\[\/spoiler\]/g, '<span style="background: #334155; padding: 2px 6px; border-radius: 4px;">$1</span>');

      modalDesc.innerHTML = desc.replace(/\n/g, '<br>');
      modalRefs.innerHTML = '';

      const posterUrl = details.poster?.originalUrl;
      if (posterUrl) {
        const validPoster = getValidImageUrl(posterUrl);
        const refEl = document.createElement('div');
        refEl.className = 'ref-item';
        refEl.setAttribute('role', 'listitem');
        refEl.title = 'Основной постер';
        const imgEl = document.createElement('img');
        imgEl.src = validPoster;
        imgEl.alt = 'Основной постер персонажа';
        imgEl.loading = 'lazy';
        imgEl.tabIndex = 0;
        imgEl.addEventListener('click', () => window.open(validPoster, '_blank', 'noopener'));
        imgEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            window.open(validPoster, '_blank', 'noopener');
          }
        });
        attachImgFallback(imgEl);
        refEl.appendChild(imgEl);
        modalRefs.appendChild(refEl);
      }

      if (char.image && char.image !== MISSING_IMG) {
        const refEl = document.createElement('div');
        refEl.className = 'ref-item';
        refEl.setAttribute('role', 'listitem');
        refEl.title = 'Портрет';
        const imgEl = document.createElement('img');
        imgEl.src = char.image;
        imgEl.alt = 'Портрет персонажа';
        imgEl.loading = 'lazy';
        imgEl.tabIndex = 0;
        imgEl.addEventListener('click', () => window.open(char.image, '_blank', 'noopener'));
        imgEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            window.open(char.image, '_blank', 'noopener');
          }
        });
        attachImgFallback(imgEl);
        refEl.appendChild(imgEl);
        modalRefs.appendChild(refEl);
      }

      const charName = details.russian || details.name || char.name || '';
      const yandexUrl = `https://yandex.ru/images/search?text=${encodeURIComponent(charName + ' арт')}`;
      const searchRef = document.createElement('div');
      searchRef.className = 'ref-item';
      searchRef.setAttribute('role', 'listitem');
      searchRef.setAttribute('tabindex', '0');
      searchRef.setAttribute('role', 'button');
      searchRef.setAttribute('aria-label', 'Искать больше в Яндекс Картинках');
      searchRef.title = 'Искать больше в Яндекс Картинках';
      searchRef.style.cssText = 'cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#111827; text-align:center; padding:5px;';
      searchRef.innerHTML = `
        <span style="font-size:18px;" aria-hidden="true">🔍</span>
        <span style="font-size:9px; color:#a5b4fc; margin-top:4px;">Ещё в Яндекс ↗</span>`;
      searchRef.addEventListener('click', () => window.open(yandexUrl, '_blank', 'noopener'));
      searchRef.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          window.open(yandexUrl, '_blank', 'noopener');
        }
      });
      modalRefs.appendChild(searchRef);

    } else {
      modalDesc.textContent = 'Не удалось загрузить подробную информацию.';
      modalRefs.innerHTML = '';
    }
  } catch(e) {
    if (mySeq !== detailsSeq) return;
    modalDesc.textContent = 'Ошибка загрузки: ' + e.message;
    modalRefs.innerHTML = '';
  } finally {
    if (modalContent) modalContent.setAttribute('aria-busy', 'false');
  }
}

function closeModal(e) {
  if (!e || e.target.id === 'charModal' || e.target.classList.contains('modal-close')) {
    closeModalById('charModal');
  }
}

/* ---------- Экспорт ---------- */

function exportJSON() {
  if (!currentAnime || !allCharacters.length) return;
  const data = {
    anime: { id: currentAnime.id, title: currentAnime.russian || currentAnime.name },
    characters: allCharacters
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `shikimori_${currentAnime.id}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 100);
}
</script>
